<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <title>Mr. Restaurant</title>
</head>
<body>
<div id="wrapper">
    <h1>Order from Mr. Restaurant:</h1>
    <div id="nameBox">

        <p>Your name:</p>
        <input type="text" id="name" placeholder="Name"/>
    </div>
    <div id="itemBox">
        <p>Item:</p>
        <select name="item" id="item">
            <option value="100">Mystery Sandwich - $100</option>
            <option value="4">Soup Surprise - $4</option>
            <option value="1.5">Italian Style - $1.50</option>
        </select>
    </div>
    <div id="qBox">
        <p>Quantity:</p>
        <input type="text" id="quantity" placeholder="Quantity"/>
    </div>
    <button id="submit">Order Now</button>
    <div id="thanks"></div>
</div>



<script src="js/app.js"></script>
</body>
</html>
